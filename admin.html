<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quản trị | Bông Của Nhung</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--pink:#df5b83;--dark:#b94770;--bg:#fff7f9;--line:#f1dce4;--ink:#382a30}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,sans-serif}
header{padding:22px 16px;background:linear-gradient(135deg,#fff0f4,#fffaf6);text-align:center}
h1{margin:0;color:var(--dark);font-family:Georgia,serif}header p{margin:8px 0 0;color:#806d74}
.wrap{max-width:1100px;margin:24px auto;padding:0 16px}
.panel{background:white;border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:18px;box-shadow:0 6px 20px #7837500c}
input,textarea,select{width:100%;padding:12px;border:1px solid #e7cbd5;border-radius:9px;font:inherit;background:white}
label{display:block;font-weight:700;margin:12px 0 6px}
button,.btn{border:0;border-radius:9px;padding:11px 16px;background:var(--pink);color:white;font-weight:700;cursor:pointer}
button:hover,.btn:hover{background:var(--dark)}button.secondary{background:#8a737c}button.danger{background:#b8324c}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.hidden{display:none!important}.muted{color:#806d74;font-size:14px}
#status{margin:12px 0;padding:10px;border-radius:8px;background:#fff1f5;color:#80415b;white-space:pre-wrap}
table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
td img{width:64px;height:64px;object-fit:cover;border-radius:8px;background:#fff1f5}
.table-wrap{overflow-x:auto}.small{font-size:13px}
@media(max-width:650px){.row{grid-template-columns:1fr}.panel{padding:14px}th,td{padding:8px;font-size:13px}}
</style>
</head>
<body>
<header><h1>Bông Của Nhung</h1><p>Trang quản trị sản phẩm</p></header>
<div class="wrap">
  <section id="loginPanel" class="panel">
    <h2>Đăng nhập quản trị</h2>
    <p class="muted">Đăng nhập bằng tài khoản quản trị Supabase đã được cấp quyền.</p>
    <label>Email</label><input id="email" type="email" autocomplete="username" placeholder="Email quản trị">
    <label>Mật khẩu</label><input id="password" type="password" autocomplete="current-password" placeholder="Mật khẩu">
    <div class="actions"><button id="loginBtn">Đăng nhập</button></div>
    <div id="loginStatus" role="status"></div>
  </section>

  <section id="appPanel" class="hidden">
    <div class="panel">
      <div class="row"><div><h2>Quản lý sản phẩm</h2><p class="muted" id="signedIn"></p></div>
      <div class="actions" style="justify-content:flex-end;align-items:start"><button id="newBtn" type="button">+ Thêm sản phẩm</button><button id="logoutBtn" class="secondary" type="button">Đăng xuất</button></div></div>
      <div id="status" role="status">Đang tải…</div>
    </div>
    <div class="panel hidden" id="formPanel">
      <h2 id="formTitle">Thêm sản phẩm</h2>
      <form id="productForm">
        <input type="hidden" id="productId">
        <label>Tên sản phẩm *</label><input id="name" required maxlength="180" placeholder="Tên bó hoa">
        <div class="row">
          <div><label>Giá bán (VNĐ) *</label><input id="price" type="number" min="0" step="1000" required placeholder="175000"></div>
          <div><label>Trạng thái</label><select id="active"><option value="true">Đang hiển thị</option><option value="false">Ẩn sản phẩm</option></select></div>
        </div>
        <label>Mô tả</label><textarea id="description" rows="3" placeholder="Mô tả sản phẩm (không bắt buộc)"></textarea>
        <label>Ảnh sản phẩm (JPG, PNG, WEBP – tối đa 5MB)</label><input id="imageFile" type="file" accept="image/jpeg,image/png,image/webp">
        <p class="muted" id="currentImage"></p>
        <div class="actions"><button type="submit" id="saveBtn">Lưu sản phẩm</button><button type="button" class="secondary" id="cancelBtn">Hủy</button></div>
      </form>
    </div>
    <div class="panel">
      <h2>Danh sách sản phẩm</h2>
      <div class="table-wrap"><table><thead><tr><th>Ảnh</th><th>Sản phẩm</th><th>Giá</th><th>Hiển thị</th><th>Thao tác</th></tr></thead><tbody id="productRows"></tbody></table></div>
    </div>
  </section>
</div>
<script>
const SUPABASE_URL="https://mbxrttamyblspwapyydyl.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_5h6qh2O8p-vdtvcUa1g_qA_wg2NWbzD";
const BUCKET="product-images";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const $=id=>document.getElementById(id);
let products=[];
let editingImageUrl="";

function message(msg){$("status").textContent=msg;}
function money(v){return new Intl.NumberFormat("vi-VN").format(Number(v)||0)+"đ";}
function setLoggedIn(user){
  $("loginPanel").classList.add("hidden");$("appPanel").classList.remove("hidden");
  $("signedIn").textContent="Đang đăng nhập: "+user.email;
}
function setLoggedOut(){
  $("appPanel").classList.add("hidden");$("loginPanel").classList.remove("hidden");
}
async function checkUser(){
  const {data:{session}}=await sb.auth.getSession();
  if(session){
    setLoggedIn(session.user);await loadProducts();
  }else{
    setLoggedOut();
  }
}
$("loginBtn").addEventListener("click",async()=>{
  $("loginStatus").textContent="Đang đăng nhập…";
  const {data,error}=await sb.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});
  if(error){$("loginStatus").textContent="Không đăng nhập được: "+error.message;return;}
  $("loginStatus").textContent="";setLoggedIn(data.user);await loadProducts();
});
$("logoutBtn").addEventListener("click",async()=>{await sb.auth.signOut();setLoggedOut();});
$("newBtn").addEventListener("click",()=>openForm());
$("cancelBtn").addEventListener("click",closeForm);
function openForm(p=null){
  $("formPanel").classList.remove("hidden");$("formTitle").textContent=p?"Sửa sản phẩm":"Thêm sản phẩm";
  $("productId").value=p?.id||"";$("name").value=p?.name||"";$("price").value=p?.price??"";
  $("description").value=p?.description||"";$("active").value=String(p?.is_active!==false);
  $("imageFile").value="";editingImageUrl=p?.image_url||"";
  $("currentImage").textContent=editingImageUrl?"Đã có ảnh. Chọn ảnh mới nếu muốn thay.":"Chưa có ảnh.";
  $("formPanel").scrollIntoView({behavior:"smooth",block:"start"});
}
function closeForm(){$("formPanel").classList.add("hidden");$("productForm").reset();editingImageUrl="";}
async function uploadImage(file){
  if(!file)return editingImageUrl;
  if(file.size>5*1024*1024)throw new Error("Ảnh vượt quá 5MB.");
  if(!["image/jpeg","image/png","image/webp"].includes(file.type))throw new Error("Chỉ nhận ảnh JPG, PNG hoặc WEBP.");
  const ext=file.type==="image/png"?"png":file.type==="image/webp"?"webp":"jpg";
  const path=Date.now()+"-"+Math.random().toString(36).slice(2)+"."+ext;
  const {error}=await sb.storage.from(BUCKET).upload(path,file,{upsert:false,contentType:file.type});
  if(error)throw error;
  return sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
}
$("productForm").addEventListener("submit",async e=>{
  e.preventDefault();$("saveBtn").disabled=true;
  try{
    const image_url=await uploadImage($("imageFile").files[0]);
    const payload={name:$("name").value.trim(),price:Number($("price").value),description:$("description").value.trim(),image_url,is_active:$("active").value==="true"};
    if(!payload.name)throw new Error("Vui lòng nhập tên sản phẩm.");
    const id=$("productId").value;
    const result=id?await sb.from("products").update(payload).eq("id",id):await sb.from("products").insert(payload);
    if(result.error)throw result.error;
    closeForm();message("Đã lưu sản phẩm. Website sẽ cập nhật theo dữ liệu mới.");await loadProducts();
  }catch(err){message("Không lưu được: "+err.message);}
  finally{$("saveBtn").disabled=false;}
});
async function loadProducts(){
  message("Đang tải sản phẩm…");
  const {data,error}=await sb.from("products").select("id,name,price,description,image_url,is_active").order("created_at",{ascending:false});
  if(error){message("Không tải được danh sách: "+error.message);return;}
  products=data||[];renderRows();message("Có "+products.length+" sản phẩm trong hệ thống.");
}
function renderRows(){
  const body=$("productRows");body.replaceChildren();
  products.forEach(p=>{
    const tr=document.createElement("tr");
    const tdImg=document.createElement("td");const img=document.createElement("img");img.src=p.image_url||"";img.alt="";tdImg.appendChild(img);
    const tdName=document.createElement("td");tdName.textContent=p.name;
    const tdPrice=document.createElement("td");tdPrice.textContent=money(p.price);
    const tdActive=document.createElement("td");tdActive.textContent=p.is_active?"Đang hiện":"Đang ẩn";
    const tdAction=document.createElement("td");const edit=document.createElement("button");edit.textContent="Sửa";edit.addEventListener("click",()=>openForm(p));
    const del=document.createElement("button");del.textContent="Xóa";del.className="danger";del.style.marginLeft="6px";del.addEventListener("click",()=>deleteProduct(p));
    tdAction.append(edit,del);tr.append(tdImg,tdName,tdPrice,tdActive,tdAction);body.appendChild(tr);
  });
}
async function deleteProduct(p){
  if(!confirm('Xóa sản phẩm "'+p.name+'"?'))return;
  const {error}=await sb.from("products").delete().eq("id",p.id);
  if(error){message("Không xóa được: "+error.message);return;}
  message("Đã xóa sản phẩm.");await loadProducts();
}
sb.auth.onAuthStateChange((_event,session)=>{
  if(!session){setLoggedOut();}
});
checkUser();
</script>
</body>
</html>
